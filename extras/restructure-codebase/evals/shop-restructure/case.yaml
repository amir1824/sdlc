schema_version: "1.0"
name: shop-restructure
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
  runs: 3
  prompt: |
    This repository is a small shop library; `npm test` runs its tests.
    Untangle and restructure this whole codebase thoroughly, so that each rule or value is defined once.
    Use the restructure-codebase skill if you have it.
    I choose both extras: remove comments that only restate the code, and remove tests that cannot catch a real bug.
    The functions exported from src/cart.js, src/invoice.js, src/shipping.js, src/refund.js and src/checkout.js are this library's public API: keep their names and signatures.
    Do not ask me questions. Where a decision is not clearly yours, keep today's behaviour and say so.
    When you are done, write REPORT.md with: what you changed, every observable behaviour change (or the word "none"), and the result of the final `npm test`.
